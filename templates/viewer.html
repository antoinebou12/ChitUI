<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Model Viewer with Multi-Model & Build-Plate Settings</title>
  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html { margin: 0; height: 100%; overflow: hidden; }
    #app { display: flex; height: 100%; }
    #sideMenu { width: 300px; background: #f8f9fa; padding: 15px; overflow-y: auto; }
    #viewer-container { flex-grow: 1; position: relative; }
    #viewer { width: 100%; height: 100%; display: block; }
    .btn-group-vertical .btn { margin-bottom: 5px; }
    label { font-weight: 600; }
  </style>
  <!-- Three.js and loaders/scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <div id="app">
    <!-- Side menu -->
    <div id="sideMenu">
      <h5>Printer Settings</h5>
      <div class="mb-3">
        <label for="printerSelect" class="form-label">Select Printer</label>
        <select id="printerSelect" class="form-select form-select-sm">
          <option value="118,66">Elegoo Saturn (118×66 mm)</option>
          <option value="143.36,89.6">Elegoo Saturn 2 (143.36×89.6 mm)</option>
          <option value="129.6,72.8">Elegoo Mars (129.6×72.8 mm)</option>
          <option value="200,200">Custom: 200×200 mm</option>
        </select>
      </div>
      <hr>
      <h5>Model Controls</h5>
      <div class="mb-3">
        <label for="fileInput" class="form-label">Load STL (Multi)</label>
        <input class="form-control form-control-sm" type="file" id="fileInput" accept=".stl" multiple>
      </div>
      <div class="mb-3">
        <label class="form-label">Transform Mode</label>
        <div class="btn-group-vertical w-100">
          <button id="translateBtn" class="btn btn-outline-primary btn-sm">Translate</button>
          <button id="rotateBtn" class="btn btn-outline-primary btn-sm">Rotate</button>
          <button id="scaleBtn" class="btn btn-outline-primary btn-sm">Scale</button>
        </div>
      </div>
      <div class="mb-3">
        <label for="scaleSlider" class="form-label">Uniform Scale</label>
        <input type="range" class="form-range" id="scaleSlider" min="0.1" max="5" step="0.1" value="1">
      </div>
      <div class="mb-3">
        <button id="layoutBtn" class="btn btn-outline-success w-100 btn-sm">Auto Layout Models</button>
      </div>
      <hr>
      <h5>Camera</h5>
      <div class="mb-3">
        <button id="resetCamera" class="btn btn-secondary w-100 btn-sm">Reset View</button>
      </div>
    </div>

    <!-- Viewer -->
    <div id="viewer-container">
      <canvas id="viewer"></canvas>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let orbitControls, transformControls;
    let loader;
    let plate, grid;
    let meshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    init(); animate();

    function init() {
      // Scene & Background
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0f0f0);

      // Camera
      camera = new THREE.PerspectiveCamera(45, (window.innerWidth-300)/window.innerHeight, 0.1, 2000);
      camera.position.set(200, 200, 200);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('viewer'), antialias: true });
      onWindowResize();
      window.addEventListener('resize', onWindowResize);
      document.getElementById('viewer').addEventListener('pointerdown', onPointerDown);

      // Lights
      scene.add(new THREE.AmbientLight(0x888888));
      const dir = new THREE.DirectionalLight(0xffffff, 0.6);
      dir.position.set(100,200,100);
      scene.add(dir);

      // Controls
      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;

      transformControls = new THREE.TransformControls(camera, renderer.domElement);
      transformControls.addEventListener('dragging-changed', e=>orbitControls.enabled = !e.value);
      scene.add(transformControls);

      // Build plate & grid
      createPlate();

      // Loader
      loader = new THREE.STLLoader();

      // UI Hooks
      document.getElementById('printerSelect').addEventListener('change', onPrinterChange);
      document.getElementById('fileInput').addEventListener('change', e=>loadSTLs(e.target.files));
      document.getElementById('translateBtn').onclick = ()=>setTransformMode('translate');
      document.getElementById('rotateBtn').onclick    = ()=>setTransformMode('rotate');
      document.getElementById('scaleBtn').onclick     = ()=>setTransformMode('scale');
      document.getElementById('scaleSlider').oninput  = onScaleSlider;
      document.getElementById('layoutBtn').onclick    = layoutModels;
      document.getElementById('resetCamera').onclick  = resetCamera;
    }

    function createPlate() {
      // Remove existing
      if (plate) scene.remove(plate);
      if (grid) scene.remove(grid);

      // Get dims
      const val = document.getElementById('printerSelect').value.split(',');
      const [w,d] = val.map(Number);

      // Grid
      grid = new THREE.GridHelper(Math.max(w,d), 20, 0x888888, 0xdddddd);
      scene.add(grid);
      
      // Plate
      const geo = new THREE.PlaneGeometry(w, d);
      const mat = new THREE.MeshStandardMaterial({ color:0xcccccc, side:THREE.DoubleSide });
      plate = new THREE.Mesh(geo, mat);
      plate.rotation.x = -Math.PI/2;
      plate.position.y = 0;
      scene.add(plate);
    }

    function onPrinterChange() {
      createPlate();
      resetCamera();
    }

    function loadSTLs(files) {
      // Clear previous
      meshes.forEach(m=>{ scene.remove(m); }); meshes = [];
      transformControls.detach();

      Array.from(files).forEach(file=>{
        const reader = new FileReader();
        reader.onload = ()=>{
          const geom = loader.parse(reader.result);
          geom.center(); geom.computeBoundingBox();
          const size = geom.boundingBox.getSize(new THREE.Vector3()).length();
          const scale = Math.min(...document.getElementById('printerSelect').value.split(',').map(Number)) / size;
          geom.scale(scale,scale,scale);
          const mesh = new THREE.Mesh(geom, new THREE.MeshNormalMaterial());
          scene.add(mesh);
          meshes.push(mesh);
          // attach to last mesh
          transformControls.attach(mesh);
        };
        reader.readAsArrayBuffer(file);
      });
    }

    function setTransformMode(mode) {
      transformControls.setMode(mode);
    }

    function onScaleSlider(e) {
      const s = parseFloat(e.target.value);
      const obj = transformControls.object;
      if (obj) obj.scale.set(s,s,s);
    }

    function layoutModels() {
      const count = meshes.length;
      if (!count) return;
      const cols = Math.ceil(Math.sqrt(count));
      const spacing = Math.max(...document.getElementById('printerSelect').value.split(',').map(Number)) / (cols + 1);
      meshes.forEach((m,i)=>{
        const x = ((i % cols) - (cols-1)/2) * spacing;
        const z = (Math.floor(i/cols) - (cols-1)/2) * spacing;
        m.position.set(x, 0, z);
      });
      transformControls.detach();
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left)/rect.width)*2-1;
      mouse.y = -((event.clientY - rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(meshes);
      if (hits.length) transformControls.attach(hits[0].object);
    }

    function resetCamera() {
      camera.position.set(200,200,200);
      orbitControls.target.set(0,0,0);
      orbitControls.update();
    }

    function onWindowResize() {
      const w = window.innerWidth - 300, h = window.innerHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update(); renderer.render(scene, camera);
    }
  </script>
</body>
</html>
